[project]
name = "commitment-tracker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "openai>=3.22.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["live: calls the real Nebius API (needs NEBIUS_API_KEY)"]
pythonpath = ["."]
# Live tests call Nebius and spend credits. Run them on purpose with: pytest -m live -s
addopts = "-m 'not live'"
